# Production stack for M (this machine): always-on, single origin behind Caddy + basic auth,
# reachable only via the existing Cloudflare Tunnel. Self-contained (does NOT extend the dev
# compose). See SERVER_DEPLOY.md for the full standup procedure and the decisions still open.
#
#   cd "/srv/agentic/robinhood-agentic"
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Only Caddy is published, to 127.0.0.1:${DASH_PORT} — cloudflared connects there. The backend and
# frontend have NO host ports; they're only reachable through Caddy (which enforces basic auth).
# Env: backend/.env (ANTHROPIC_API_KEY, models) + deploy/.env (DASH_USER, DASH_PASSWORD_HASH, DASH_PORT).
#
# Container hardening (issue #16, SENIOR_ENGINEER_BAR §6.3 — same posture as docker-compose.db.yml):
# no-new-privileges + cap_drop ALL everywhere; read-only rootfs where the process provably needs no
# rootfs writes; memory/cpu/pids caps sized so this stack cannot starve 9b on the same box; log
# rotation caps on every service.
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # backend/.env carries the secrets, including DATABASE_URL (role rh_app) and AUTH_DATABASE_URL
    # (role rh_auth) — see backend/.env.example for the role split and the ALTER ROLE step. Unset
    # or empty DSNs are a supported "no database" state; the backend degrades instead of failing
    # (backend/app/db/config.py).
    env_file:
      - ../backend/.env
    environment:
      - JURY_MODEL=${JURY_MODEL:-claude-haiku-4-5}
      - SYNTH_MODEL=${SYNTH_MODEL:-claude-sonnet-4-6}
      # Same origin via Caddy → no cross-origin requests, so CORS can stay closed.
      - CORS_ORIGINS=
      - CORS_ORIGIN_REGEX=
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      # SLATE.md and THESES.md, read-only. MOUNTED rather than baked into the image: they are the
      # owner's written record of what the book should be, edited by hand, and a copy frozen at
      # build time would let the dashboard show a target the document no longer states — with the
      # dashboard winning silently. Read-only because the app has no business editing them.
      - ../docs:/app/docs:ro
    # Run as the host user, for the same reason the dev stack does (docker-compose.yml:15-19).
    # data/ and logs/ are 0700 on the host because they hold the holdings snapshot, cost basis and
    # the refresh trigger. The image's own user is uid 1001, which does not exist on the host, so a
    # 1001 process cannot even traverse a 0700 dir owned by the host user — the backend died at
    # startup on `mkdir /app/logs/debates` with EACCES.
    #
    # The alternative fixes are both worse: chmod 0777 on the host would make the snapshot readable
    # and the refresh trigger forgeable by any local account, and baking the host uid into the image
    # would make the image host-specific.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Proton Mail Bridge (the SMTP relay for auth email) listens on the docker host; this maps
    # host.docker.internal to the host-gateway address so SMTP_HOST=host.docker.internal resolves
    # from inside the container. Same pattern as 9b Korean Master's compose files.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Dual-homed, deliberately (ADR-001 amendment of 2026-08-13; docs/AUTH_THREAT_MODEL.md §8):
    # `default` for Caddy/frontend and internet egress, `rh-internal` for rh-db. The backend is
    # now the one process that can both read the database and reach the internet; the ADR records
    # what that spends and what compensates. `default` listed explicitly — naming any network on a
    # service drops the implicit one. Frontend and Caddy stay OFF rh-internal.
    networks:
      - default
      - rh-internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only rootfs: writable paths are exactly the two bind mounts and /tmp. A compromised
    # handler cannot modify app code or site-packages at runtime.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    memswap_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No read_only here, deliberately: `next start` writes runtime caches under /app/.next/cache,
    # and the container runs as a non-fixed-uid `nodejs` user, so a tmpfs mount there cannot be
    # chowned to it from compose. no-new-privileges + cap_drop ALL still hold.
    memswap_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
          pids: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2
    depends_on:
      - backend
      - frontend
    # No DASH_USER / DASH_PASSWORD_HASH any more: the shared-password gate was removed from the
    # Caddyfile once the app grew real per-operator authentication (issue #17). Leaving the two
    # `:?` required-variable guards here would fail the whole stack's startup over credentials
    # nothing reads. The values may still sit in deploy/.env; they are inert.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Published to localhost ONLY — cloudflared reaches it here; nothing else is exposed.
    ports:
      - "127.0.0.1:${DASH_PORT:-8088}:80"
    restart: always
    security_opt:
      - no-new-privileges:true
    # The caddy image runs as root and binds :80 inside the container; NET_BIND_SERVICE is the one
    # capability that requires. Everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Caddy's writable state lives on the two named volumes (certs/config); the rootfs stays
    # read-only. /tmp for scratch.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1.0"
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:

networks:
  # The db stack's internal-only bridge (docker-compose.db.yml owns and creates it). External:
  # this compose attaches, never creates. Prod standup order therefore matters — the db stack
  # (bin/db_up.sh) must be up (or the network created) before this stack starts.
  rh-internal:
    external: true
    name: rh-internal
