# Production stack for M (this machine): always-on, single origin behind Caddy + basic auth,
# reachable only via the existing Cloudflare Tunnel. Self-contained (does NOT extend the dev
# compose). See SERVER_DEPLOY.md for the full standup procedure and the decisions still open.
#
#   cd "/srv/agentic/robinhood-agentic"
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Only Caddy is published, to 127.0.0.1:${DASH_PORT} — cloudflared connects there. The backend and
# frontend have NO host ports; they're only reachable through Caddy (which enforces basic auth).
# Env: backend/.env (ANTHROPIC_API_KEY, models) + deploy/.env (DASH_USER, DASH_PASSWORD_HASH, DASH_PORT).
#
# Container hardening (issue #16, SENIOR_ENGINEER_BAR §6.3 — same posture as docker-compose.db.yml):
# no-new-privileges + cap_drop ALL everywhere; read-only rootfs where the process provably needs no
# rootfs writes; memory/cpu/pids caps sized so this stack cannot starve 9b on the same box; log
# rotation caps on every service.
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # backend/.env carries the secrets, including DATABASE_URL (role rh_app) and AUTH_DATABASE_URL
    # (role rh_auth) — see backend/.env.example for the role split and the ALTER ROLE step. Unset
    # or empty DSNs are a supported "no database" state; the backend degrades instead of failing
    # (backend/app/db/config.py).
    env_file:
      - ../backend/.env
    environment:
      - JURY_MODEL=${JURY_MODEL:-claude-haiku-4-5}
      - SYNTH_MODEL=${SYNTH_MODEL:-claude-sonnet-4-6}
      # Same origin via Caddy → no cross-origin requests, so CORS can stay closed.
      - CORS_ORIGINS=
      - CORS_ORIGIN_REGEX=
      # Where the Lab lives. The backend is the ONLY thing that may reach it (see the lab service
      # below). Unset is supported and means "the Lab is not deployed here" — the routes answer 503
      # with that sentence rather than a connection error that reads like a broken service.
      - LAB_BASE_URL=http://lab:8100
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      # SLATE.md and THESES.md, read-only. MOUNTED rather than baked into the image: they are the
      # owner's written record of what the book should be, edited by hand, and a copy frozen at
      # build time would let the dashboard show a target the document no longer states — with the
      # dashboard winning silently. Read-only because the app has no business editing them.
      - ../docs:/app/docs:ro
    # Run as the host user, for the same reason the dev stack does (docker-compose.yml:15-19).
    # data/ and logs/ are 0700 on the host because they hold the holdings snapshot, cost basis and
    # the refresh trigger. The image's own user is uid 1001, which does not exist on the host, so a
    # 1001 process cannot even traverse a 0700 dir owned by the host user — the backend died at
    # startup on `mkdir /app/logs/debates` with EACCES.
    #
    # The alternative fixes are both worse: chmod 0777 on the host would make the snapshot readable
    # and the refresh trigger forgeable by any local account, and baking the host uid into the image
    # would make the image host-specific.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Proton Mail Bridge (the SMTP relay for auth email) listens on the docker host; this maps
    # host.docker.internal to the host-gateway address so SMTP_HOST=host.docker.internal resolves
    # from inside the container. Same pattern as 9b Korean Master's compose files.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Dual-homed, deliberately (ADR-001 amendment of 2026-08-13; docs/AUTH_THREAT_MODEL.md §8):
    # `default` for Caddy/frontend and internet egress, `rh-internal` for rh-db. The backend is
    # now the one process that can both read the database and reach the internet; the ADR records
    # what that spends and what compensates. `default` listed explicitly — naming any network on a
    # service drops the implicit one. Frontend and Caddy stay OFF rh-internal.
    networks:
      - default
      - rh-internal
    # Deliberately NOT `depends_on: lab`. The Lab is optional and slow to start (it imports xgboost,
    # scikit-learn and statsmodels); gating the dashboard on it would mean a Lab that fails to build
    # takes the portfolio page down with it. The proxy answers 503 while the Lab is absent.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only rootfs: writable paths are exactly the two bind mounts and /tmp. A compromised
    # handler cannot modify app code or site-packages at runtime.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    memswap_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  lab:
    # The Testing Lab. Trains and validates models; measures, never trades.
    #
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # THIS SERVICE HAS NO AUTHENTICATION, AND THAT IS THE DESIGN.
    #
    # It is reachable ONLY from the backend: `rh-internal` only, no `ports:`, and no route in
    # deploy/Caddyfile. Everything that gets in has therefore already passed the app-wide CSRF
    # guard and session gate in backend/app/main.py, via the enumerated proxy in
    # backend/app/routers/testing_lab.py.
    #
    # ADDING A `ports:` LINE OR A CADDY ROUTE HERE TURNS IT INTO AN UNAUTHENTICATED ENDPOINT THAT
    # TRAINS MODELS ON DEMAND. This paragraph is repeated in lab/app.py and in the proxy router,
    # because the guarantee is split across all three files and no one of them can state it alone.
    # ─────────────────────────────────────────────────────────────────────────────────────────
    build:
      context: ..
      dockerfile: lab/Dockerfile
    # backend/.env is the single place DATABASE_URL is written, so the Lab reads it from there —
    # and then every secret in that file that the Lab has no business holding is BLANKED below.
    #
    # The blanks are the point. `environment` overrides `env_file`, so each line is an explicit
    # denial that survives someone adding a new key to backend/.env without thinking about this
    # service. The Lab reads bars and writes its own three tables; it has no auth path, no broker,
    # no model API, and no mail. A test (backend/tests/test_testing_lab_proxy.py) reads this file
    # and fails if a secret-shaped key in backend/.env is missing a denial here.
    env_file:
      - ../backend/.env
    environment:
      # Denied: the auth role's DSN and the key that decrypts TOTP secrets. Migration 012 REVOKEs
      # the auth tables from rh_app entirely, so even the DSN it DOES hold cannot read them.
      - AUTH_DATABASE_URL=
      - TOTP_SECRET_ENC_KEY=
      # Denied: the broker. The Lab must never be able to place an order, and the cheapest way to
      # guarantee that is for it to hold no credential that could.
      - ALPACA_API_KEY_ID=
      - ALPACA_API_SECRET_KEY=
      - AGENTIC_ACCOUNT_NUMBER=
      # Denied: billable third-party APIs. Nothing here calls out — the service has no `default`
      # network, so these would not work even if they were set.
      - ANTHROPIC_API_KEY=
      - FMP_API_KEY=
      # Denied: mail. A training service has nobody to write to.
      - SMTP_HOST=
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=
    # `rh-internal` ONLY — no `default`. The Lab needs the database and nothing else; it makes no
    # outbound calls, so it has no reason to reach the internet and now cannot. This is stricter
    # than the backend, which is dual-homed because it must call the Anthropic API.
    networks:
      - rh-internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/api/testing-lab/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Longer than the others: importing xgboost, scikit-learn and statsmodels takes real seconds,
      # and a start_period shorter than that restart-loops a container that is merely booting.
      start_period: 45s
    restart: always
    expose:
      - "8100"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only rootfs. The Lab persists results to the database, not to disk — the one thing it
    # writes is joblib scratch, which lives in /tmp.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
    # Sized above the backend's 1g: fitting a forest over a few thousand bars holds the feature
    # matrix, the ensemble and the walk-forward predictions at once. The cap still exists so a
    # runaway sweep cannot take the box down — 9b runs on this machine too.
    memswap_limit: 3g
    deploy:
      resources:
        limits:
          memory: 3g
          # Two cores, not all of them. A training run is pure CPU and would otherwise starve the
          # backend it is proxied through, so the page that shows the results stops rendering while
          # they are computed.
          cpus: "2.0"
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No read_only here, deliberately: `next start` writes runtime caches under /app/.next/cache,
    # and the container runs as a non-fixed-uid `nodejs` user, so a tmpfs mount there cannot be
    # chowned to it from compose. no-new-privileges + cap_drop ALL still hold.
    memswap_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
          pids: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2
    depends_on:
      - backend
      - frontend
    # No DASH_USER / DASH_PASSWORD_HASH any more: the shared-password gate was removed from the
    # Caddyfile once the app grew real per-operator authentication (issue #17). Leaving the two
    # `:?` required-variable guards here would fail the whole stack's startup over credentials
    # nothing reads. The values may still sit in deploy/.env; they are inert.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Published to localhost ONLY — cloudflared reaches it here; nothing else is exposed.
    ports:
      - "127.0.0.1:${DASH_PORT:-8088}:80"
    restart: always
    security_opt:
      - no-new-privileges:true
    # The caddy image runs as root and binds :80 inside the container; NET_BIND_SERVICE is the one
    # capability that requires. Everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Caddy's writable state lives on the two named volumes (certs/config); the rootfs stays
    # read-only. /tmp for scratch.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1.0"
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:

networks:
  # The db stack's internal-only bridge (docker-compose.db.yml owns and creates it). External:
  # this compose attaches, never creates. Prod standup order therefore matters — the db stack
  # (bin/db_up.sh) must be up (or the network created) before this stack starts.
  rh-internal:
    external: true
    name: rh-internal
