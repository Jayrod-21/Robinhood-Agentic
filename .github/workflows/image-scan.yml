# Container image scanning + SBOM (SENIOR_ENGINEER_BAR §6.2 / §3.11).
#
# Scans the two images this repo ships or depends on:
#   * rh-migrate — built here from db/Dockerfile (hash-pinned deps; the build itself would fail on
#     a tampered wheel, this catches vulnerable-but-authentic ones);
#   * rh-postgres — built here from db/Dockerfile.postgres, the image docker-compose.db.yml runs.
#     Both are digest-pinned bases with a distro upgrade layer on top, so what is scanned is what
#     ships; new CVEs land after the digest was chosen, which is what the weekly schedule catches.
#
# Fails on HIGH/CRITICAL with an available fix. Actions are pinned to commit SHAs, not tags
# (Bar §5.9 — the tj-actions compromise was a moved tag).

name: Image scan

on:
  push:
    paths:
      - "db/Dockerfile"
      - "db/Dockerfile.postgres"
      - "db/requirements.txt"
      - "docker-compose.db.yml"
      - ".github/workflows/image-scan.yml"
  schedule:
    # Weekly rescan: images that scanned clean at build time do not stay clean.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Trivy — migrate runner + postgres base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build rh-migrate image
        run: docker build -f db/Dockerfile -t rh-migrate:ci db/

      - name: Scan rh-migrate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rh-migrate:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build rh-postgres image
        run: docker build -f db/Dockerfile.postgres -t rh-postgres:ci db/

      - name: Scan rh-postgres image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rh-postgres:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # gosu is excluded DELIBERATELY, not to make the gate green by fiat: postgres:16-alpine
          # ships a gosu built on a stale Go stdlib, flagging 22 HIGH/CRITICAL TLS/net-parsing CVEs
          # as of the 2026-09-15 digest. gosu's only job in this image is the entrypoint's one-shot
          # root→postgres privilege drop — it never touches a socket, so those code paths are
          # unreachable. It is also a vendored binary, not an apk package, so the image's own
          # upgrade layer cannot reach it. Without this scope the job is permanently red on findings
          # we cannot act on, which trains people to ignore it. Re-test without the skip whenever
          # the digest is bumped.
          skip-files: usr/local/bin/gosu

      - name: Generate SBOM (CycloneDX) for rh-migrate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rh-migrate:ci
          format: cyclonedx
          output: sbom-rh-migrate.cdx.json
          # SBOM generation must not re-evaluate severities; the gate above already did.
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-rh-migrate
          path: sbom-rh-migrate.cdx.json
          retention-days: 90
