name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repo. Nothing here comments, tags, or writes.
permissions:
  contents: read

jobs:
  hygiene:
    # Repo hygiene (issue #15): unmasked account numbers, personal home paths, symlinks that
    # dangle in a fresh clone, tracked .env files. Fast, no dependencies — the script explains
    # each check and its history.
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Run hygiene checks
        run: bash .github/scripts/repo_hygiene.sh

  dependency-audit:
    # Known-vulnerability gate (issue #15): pip-audit over the pinned Python requirements and
    # npm audit over the frontend lockfile. The db/ requirements are additionally covered by the
    # Trivy image scan, but auditing them here catches new advisories without an image rebuild.
    name: Dependency audit — pip + npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        # Pinned for the same reason ruff is: an unpinned scanner turns its own releases into
        # red builds. Bump deliberately.
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: pip-audit — backend + screen requirements
        run: python -m pip_audit --strict -r backend/requirements.txt -r requirements.txt

      - name: pip-audit — db migration runner requirements
        # Separate invocation: db/requirements.txt is hash-pinned and pip refuses to mix hashed
        # and unhashed requirement sets in one resolution.
        run: python -m pip_audit --strict -r db/requirements.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: npm audit — frontend
        # Audits the lockfile against the registry advisory DB; no install needed. Fails on any
        # high/critical advisory not in the shrink-only baseline (.github/npm-audit-baseline.txt) —
        # see the gate script's header for why a bare `npm audit --audit-level=high` is not usable
        # as a gate here yet.
        run: bash .github/scripts/npm_audit_gate.sh

  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements.txt
          # Pinned: an unpinned ruff turns a new release's rule changes into a red build on a
          # branch that changed no code. Bump deliberately, with the fixes in the same commit.
          pip install ruff==0.16.0

      # Rule selection lives in pyproject.toml so this matches `make lint` exactly.
      - name: Lint (ruff)
        run: ruff check backend/app src db

      - name: Backend unit tests
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest backend/tests -q

      - name: Screen unit tests
        run: python -m pytest tests -q

  database:
    # The migration runner and schema suite — 117 tests, the majority of the project's coverage,
    # and the code that took five review rounds to get right. It was absent from CI until
    # 2026-07-29, meaning a regression in the destructive gate, the transaction guarantee, or any
    # schema constraint would have merged green.
    name: Database — migration runner + schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        # testcontainers starts its own postgres:16-alpine, matching the digest-pinned major in
        # docker-compose.db.yml. The GitHub runner provides the Docker daemon it needs.
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]==3.3.4" "testcontainers[postgres]>=4,<5" "pytest>=8"

      - name: Migration runner + schema tests
        run: python -m pytest db/tests -q

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
