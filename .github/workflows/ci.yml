name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements.txt
          # Pinned: an unpinned ruff turns a new release's rule changes into a red build on a
          # branch that changed no code. Bump deliberately, with the fixes in the same commit.
          pip install ruff==0.16.0

      # Rule selection lives in pyproject.toml so this matches `make lint` exactly.
      - name: Lint (ruff)
        run: ruff check backend/app src db

      - name: Backend unit tests
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest backend/tests -q

      - name: Screen unit tests
        run: python -m pytest tests -q

  database:
    # The migration runner and schema suite — 117 tests, the majority of the project's coverage,
    # and the code that took five review rounds to get right. It was absent from CI until
    # 2026-07-29, meaning a regression in the destructive gate, the transaction guarantee, or any
    # schema constraint would have merged green.
    name: Database — migration runner + schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        # testcontainers starts its own postgres:16-alpine, matching the digest-pinned major in
        # docker-compose.db.yml. The GitHub runner provides the Docker daemon it needs.
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]==3.3.4" "testcontainers[postgres]>=4,<5" "pytest>=8"

      - name: Migration runner + schema tests
        run: python -m pytest db/tests -q

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
